name: Supabase keep alive

on:
  schedule:
    - cron: "0 12 * * 1,4"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          url=$(printf '%s' "$SUPABASE_URL" | tr -d '[:space:]')
          key=$(printf '%s' "$SUPABASE_ANON_KEY" | tr -d '[:space:]')

          echo "URL length: ${#url}"
          echo "Key length: ${#key}"
          echo "Key prefix: ${key:0:15}"

          status=$(curl --silent --show-error --output response.txt --write-out "%{http_code}" \
            "$url/rest/v1/keep_alive?select=id&limit=1" \
            -H "apikey: $key")

          echo "HTTP status: $status"
          cat response.txt
          echo

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            exit 1
          fi